
name: Java CI Pipeline

on: [push, pull_request]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build, testes e cobertura JaCoCo
        run: mvn clean verify

      - name: Verificar qualidade do código
        run: mvn checkstyle:check
        continue-on-error: false

      - name: Cache SonarQube
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Autenticar no SonarQube
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82
        id: auth

      - name: Analisar com SonarQube
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.organization=kaue476
            -Dsonar.projectKey=kaue476_entrega9-qualidade
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
